[theme]
primaryColor = "#667eea"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#10202E"
font = "sans serif"

[client]
toolbarMode = "viewer"
showErrorDetails = true
showSidebarNavigation = true
maxUploadSize = 200

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
